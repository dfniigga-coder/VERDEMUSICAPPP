name: build

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Release APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze --no-fatal-infos

      - name: Build release APK
        run: flutter build apk --release

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest-apk >/dev/null 2>&1; then
            gh release edit latest-apk \
              --target "$GITHUB_SHA" \
              --title "Verde 2.0 — последняя сборка" \
              --notes "APK собран автоматически из коммита $GITHUB_SHA." \
              --latest
          else
            gh release create latest-apk \
              --target "$GITHUB_SHA" \
              --title "Verde 2.0 — последняя сборка" \
              --notes "APK собран автоматически из коммита $GITHUB_SHA." \
              --latest
          fi
          gh release upload latest-apk build/app/outputs/flutter-apk/app-release.apk --clobber
