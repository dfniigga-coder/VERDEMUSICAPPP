name: verde
description: "Verde — музыкальный плеер в стиле Spotify: мультиисточниковый поиск, локальные треки, фоновое воспроизведение."
publish_to: "none"
version: 1.1.2+4

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Воспроизведение и фоновый сервис
  just_audio: ^0.10.6
  audio_service: ^0.18.19

  # Состояние
  provider: ^6.1.5

  # Сеть и хранение.
  # Last.fm вызывается напрямую через http — отдельный пакет не нужен.
  http: ^1.6.0
  shared_preferences: ^2.5.6

  # Локальные треки с телефона
  on_audio_query_pluse: ^3.0.7
  permission_handler: ^13.0.2

  # Выбор аудиофайлов вручную
  file_picker: ^13.3.2

  # Обложки с кэшированием
  cached_network_image: ^4.0.6

  # Пути к файлам (скачанные MP3, временные файлы, кэш)
  path_provider: ^2.1.5

  # Полные треки: SoundCloud (поиск + stream URL без ручного client_id).
  # Пакет использует внутренний api-v2.soundcloud.com и сам добывает client_id.
  soundcloud_explode_dart: ^1.1.0

  # YouTube без API-ключа: поиск, метаданные и прямые аудиопотоки.
  # Используется и для стриминга, и для скачивания треков.
  youtube_explode_dart: ^3.1.0

  # Конвертация скачанного аудио (m4a/webm/opus) в MP3.
  # Audio-вариант FFmpeg: libmp3lame, opus, vorbis, AAC и другие аудиокодеки.
  ffmpeg_kit_flutter_new_audio: ^2.5.8

  # Полные треки: официальный YouTube iFrame Player API.
  # Выбран youtube_player_iframe, а не youtube_player_flutter: он легче,
  # не требует API-ключа и даёт прямой доступ к контроллеру (pause/close),
  # чего достаточно для остановки видео при уходе приложения в фон.
  youtube_player_iframe: ^6.0.2

  # Открыть поиск/видео на YouTube, если videoId не удалось распарсить.
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
